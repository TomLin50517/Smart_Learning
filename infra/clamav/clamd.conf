# clamd 設定（SD §14、SA SEQ-06）——由 infra/compose 掛載到 /etc/clamav/clamd.conf
#
# 以官方 image（clamav/clamav:1.4）的預設為基礎，只多放寬大小上限：
# clamd 內建預設 StreamMaxLength 僅 25 MB，而平台設定 upload.max_size 預設為 512 MB，
# 不放寬的話大教材會掃描失敗（INSTREAM size limit exceeded）。
#
# 調高 upload.max_size 時，這三個值要一起調（否則超過的教材會卡在 scanning 重試）。
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# 單一檔案與單次掃描的上限；與 upload.max_size（預設 512 MB）對齊
StreamMaxLength 512M
MaxFileSize 512M
# 解壓後的總掃描量：壓縮檔解開後會超過原始大小，因此留兩倍餘裕
MaxScanSize 1024M
