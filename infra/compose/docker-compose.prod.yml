# =============================================================================
# 正式環境覆寫（疊加在 docker-compose.yml 之上）
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.prod.yml up -d
#
# 授權綁定硬體 fingerprint（machine-id + DMI UUID + hostname，SD §8.4.3）。
# 容器預設 hostname 每次重建都會變、也沒有 machine-id → 重新部署後授權失效。
# 因此固定 hostname，並唯讀掛載主機的 machine-id。
# NODE_ENV=production 時，LICENSE_*_OVERRIDE 與 COOKIE_SECURE=false 會讓 API 拒絕啟動。
# =============================================================================
services:
  api:
    hostname: iac-api
    environment:
      NODE_ENV: production
    volumes:
      - /etc/machine-id:/etc/machine-id:ro

  worker:
    environment:
      NODE_ENV: production
