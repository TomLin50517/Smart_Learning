# =============================================================================
# 本機 / 單機部署（SD §9.1，Small profile）
#   cp .env.example .env   # 填入密碼
#   docker compose -f infra/compose/docker-compose.yml up --build
#
# 預設啟動 postgres / migrate / api / worker / reverse-proxy / object-storage（MinIO，Phase 3-1 起）/
# elasticsearch（Phase 3-2 起）/ backup（SD §6.28）/ clamav（SD §14）。
# MinIO、Elasticsearch 與 clamd 只在 compose 內部網路，不對外開埠。
# clamav 約需 1.5 GB 記憶體；不需要掃毒的部署可以移除該服務並把 .env 的 CLAMAV_HOST 留空。
# 不含 Redis / Kafka / RabbitMQ（ARCH §5.2、ADR-011）。
# =============================================================================
name: iac

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  image: iac-app:dev
  env_file:
    - path: ../../.env
      required: false
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: iac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in .env}
    command: >
      postgres -c shared_buffers=2GB -c work_mem=16MB -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql
    # 只綁 127.0.0.1，且避開本機常見的 5432
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d iac"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 8g

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "tools/migrate.ts"]
    environment:
      DATABASE_URL_MIGRATE: postgres://postgres:${PG_SUPERUSER_PASSWORD}@postgres:5432/iac
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    environment:
      # api 只經由 nginx 對外 → 信任一層代理的 X-Forwarded-For
      TRUST_PROXY: "1"
      <<: &backing
        S3_ENDPOINT: http://object-storage:9000
        S3_BUCKET: ${S3_BUCKET:-iac-data}
        S3_ACCESS_KEY: ${S3_ACCESS_KEY:-iac}
        S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme123}
        ELASTICSEARCH_URL: http://elasticsearch:9200
        ELASTICSEARCH_USERNAME: elastic
        ELASTICSEARCH_PASSWORD: ${ES_PASSWORD:-changeme}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/system/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 4g

  worker:
    <<: *app
    # 專用 target：掃描版 PDF 的 OCR 需要 tesseract 與 poppler-utils（約 +100 MiB）。
    # api 用不到那些二進位，因此不放進共用的 runtime（layer 仍共享，磁碟無額外成本）
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    image: iac-worker:dev
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      WORKER_QUEUES: ingest,ai,output
      # 惡意程式掃描（SD §14）：留空即停用（用 - 而非 :- ，空字串才不會被換成預設值）
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
      # 掃描版 PDF 的 OCR（SD §6.30）：這個 image 內含所需工具，因此預設開啟
      OCR_ENABLED: ${OCR_ENABLED-true}
      <<: *backing
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 4g

  # 備份（SD §6.28）：每日 pg_dump + 物件儲存增量同步，保留 7 日／4 週／6 月；
  # 平台管理員也可在「系統狀態」頁按「立即備份」。備份檔留在 backups volume，還原見 docs/ops/backup-restore.md
  backup:
    <<: *app
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: backup
    image: iac-backup:dev
    command: ["node", "tools/backup.ts"]
    environment:
      DATABASE_URL_BACKUP: postgres://postgres:${PG_SUPERUSER_PASSWORD}@postgres:5432/iac
      BACKUP_DIR: /backups
      <<: *backing
    volumes:
      - backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      # 備份一定要同步物件儲存（api／worker 少了它還能降級運作，備份不行）；
      # 也讓 docs/ops/backup-restore.md 的 `docker compose run --rm backup` 能自行帶起它
      object-storage: { condition: service_started }
    mem_limit: 1g

  # nginx + React SPA（建置產物與 nginx.conf 皆包進 image，見 Dockerfile.web）
  reverse-proxy:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: iac-web:dev
    depends_on: [api]
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
    mem_limit: 512m

  # ---- Phase 2 ---------------------------------------------------------------
  # 教材檢索（Phase 3-2 起預設啟動；只在 compose 內部網路）。lexical_only（BM25 + cjk_bigram），
  # 不需要機器學習模組，因此關閉 ML、heap 1 GB；之後啟用語意檢索時再調高
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "true"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-changeme}
    volumes: [esdata:/usr/share/elasticsearch/data]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 教材原始檔與擷取文字（Phase 3-1 起預設啟動；只在 compose 內部網路，不對外開埠）
  object-storage:
    image: ${S3_IMAGE:-minio/minio}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-iac}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme123}
    volumes: [objdata:/data]
    mem_limit: 2g

  # 惡意程式掃描（SD §14、SA SEQ-06）：教材在移出 quarantine 之前先經 clamd 掃描。
  # 病毒庫常駐記憶體，約需 1.5 GB——資源不足的部署可以移除這個服務，並在 .env 把 CLAMAV_HOST 留空；
  # worker 會跳過掃描並在啟動時記錄一筆警告，其餘功能不受影響。
  # 不讓 worker depends_on 它：病毒庫首次下載要好幾分鐘，worker 不該被拖住——
  # clamd 還沒好的期間，教材解析會依 §11.3 重試（留在 scanning，不會被誤放行）
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamavdb:/var/lib/clamav
      # 放寬 StreamMaxLength：clamd 內建預設 25 MB，遠小於 upload.max_size（預設 512 MB）
      - ../clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    mem_limit: 2g

volumes:
  pgdata:
  esdata:
  objdata:
  backups:
  clamavdb:
