# =============================================================================
# Reverse proxy（SD §8.2、§9.2）
# 本機開發以 HTTP :80 提供；正式環境請啟用下方 TLS 區塊並掛載憑證。
# =============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 512m;
  client_body_timeout 300s;

  limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=login:10m  rate=20r/m;

  upstream api { server api:3000; keepalive 16; }

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api;
    }

    # Coach SSE：關閉緩衝（ADR-025 的分階段事件需即時送達）
    location /api/coach/ {
      proxy_pass http://api;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      add_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_read_timeout 120s;
    }

    location /public/ {
      limit_req zone=public burst=10 nodelay;
      proxy_pass http://api;
    }

    location / {
      return 404;   # web（React）於前端階段加入
    }
  }

  # --- 正式環境 TLS（SD §9.2）--------------------------------------------------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   ...（同上 location 區塊）
  # }
}
