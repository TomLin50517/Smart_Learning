openapi: 3.1.0

# =============================================================================
# Interactive AI Coach System — OpenAPI 3.1 Skeleton
# 依據：SA v1.1 §12（API Catalog）、SD v1.1 §6
# 版本：1.0.0（對應 ARCH v1.0 / SA v1.1 / SD v1.1）
# =============================================================================
# 本檔為骨架：path、method、權限標註、錯誤映射與核心 schema 齊備；
# 個別 requestBody 的細部欄位在實作時由 packages/contracts 產生後補齊。
#
# x- 擴充欄位由 CI 與程式碼中的 decorator 比對（SA INV-T4 / SD §6.3）：
#   x-required-permission  ← @RequirePermission
#   x-required-capability  ← @RequireCapability
#   x-required-limit       ← @RequireCapability 的 limit 參數
#   x-audit                ← @Audit
#   x-auth-only: true      ← 僅需已認證，不需特定 permission（session 自身操作）
# 任何不一致即建置失敗。寫入型操作若既無 x-required-permission
# 也無 x-auth-only，CI 視為漏標而失敗（SA INV-T4）。
# =============================================================================

info:
  title: Interactive AI Coach System API
  version: 1.0.0
  description: |
    通用互動式教學平台 + 有證據鏈的 AI Learning Coach。

    ## 全域不變條件（SA §0.3）

    * **INV-1** `organization_id` 由 Token scope 與資源 ownership 交叉驗證得出，
      不採信 client 傳入值。
    * **INV-2** 已發布的 course version 為 immutable。
    * **INV-3** AI Coach 不得寫入成績、註冊狀態或證書。
    * **INV-4** 完成判定為 deterministic，不依賴 LLM 可用性。
    * **INV-5** Coach 正式回答必須有通過 ACL 驗證的 citation，否則回 fallback。
    * **INV-6** 學習歷史 append-only。
    * **INV-7** Elasticsearch 的 tenant filter 由 server 注入。
    * **INV-8** 所有 write endpoint 依序通過
      AuthN → RBAC → License Capability → Ownership → Audit。

    ## 錯誤處理

    資源不存在與無權限**一律回 404**（ADR-019），避免以 ID guessing 探測
    其他組織資源是否存在。403 僅用於「在可視 scope 內但缺 permission」。
  contact:
    name: Interactive AI Coach System
  license:
    name: Proprietary

servers:
  - url: https://{host}/api
    description: 已認證 API
    variables:
      host:
        default: localhost
  - url: https://{host}
    description: 公開端點（僅證書驗證與首頁 CMS）
    variables:
      host:
        default: localhost

security:
  - sessionCookie: []

tags:
  - name: Identity
    description: 認證與個人資料
  - name: Organization
    description: 組織與使用者管理
  - name: CMS
    description: 首頁內容管理
  - name: Course
    description: 課程與版本
  - name: Enrollment
    description: 加入、重修與完成
  - name: Runtime
    description: 互動活動執行
  - name: Coach
    description: AI Coach
  - name: Knowledge
    description: 教材與衍生知識
  - name: Certificate
    description: 電子結業證明
  - name: License
    description: 授權
  - name: System
    description: 稽核、通知、健康檢查

# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: iac_session
      description: |
        HttpOnly + Secure + SameSite=Lax。已登入狀態下的所有非 GET 請求另需
        `X-CSRF-Token` header，其值須與 `iac_csrf` cookie 相同，且等於
        HMAC(SESSION_SECRET, session id)——換 session 即失效（SD §8.2）。
        公開端點（登入、密碼重設）沒有 session 可綁定，不需要此 header。
        缺少或不符回 403 `CSRF_TOKEN_INVALID`。

  parameters:
    Cursor:
      name: cursor
      in: query
      description: keyset 分頁游標，取自前一次回應的 `meta.next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '白名單欄位，格式 `field:asc` 或 `field:desc`'
      schema: { type: string }
    OrgId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    XRequestId:
      description: 請求關聯 ID，貫穿 API → job → LLM 呼叫
      schema: { type: string }
    RateLimitRemaining:
      schema: { type: integer }
    RetryAfter:
      schema: { type: integer }

  responses:
    Unauthorized:
      description: 未認證（`UNAUTHENTICATED`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        權限或授權不足。可能的 `code`：
        `PERMISSION_DENIED`、`ORG_SCOPE_DENIED`、`SOURCE_ACCESS_DENIED`、
        `COACH_TRANSCRIPT_NOT_VISIBLE`、`ACTIVITY_PREREQUISITE_NOT_MET`、
        `LICENSE_NOT_ACTIVATED`、`LICENSE_EXPIRED`、`LICENSE_CONFIG_FROZEN`、`LICENSE_FEATURE_DISABLED`、
        `LICENSE_LIMIT_EXCEEDED`、`LICENSE_HARDWARE_MISMATCH`、
        `LICENSE_SIGNATURE_INVALID`、`LICENSE_CHALLENGE_INVALID`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        不存在**或**不在可視 scope（刻意合併，ADR-019）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: |
        狀態衝突。可能的 `code`：`COURSE_VERSION_IMMUTABLE`、
        `TRANSCRIPT_VISIBILITY_IMMUTABLE`、`ENROLLMENT_NOT_ACTIVE`、
        `RESULT_NOT_READY`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: |
        驗證失敗。`COURSE_VALIDATION_FAILED` 的 `details[].issue` 帶
        `RULE_*` 子代碼；`ACTIVITY_INPUT_INVALID` 由 adapter 的
        `validateInput()` 產生。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: '`RATE_LIMITED` 或 `AI_QUOTA_EXCEEDED`'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: '`COACH_PROVIDER_UNAVAILABLE` 或 `SOURCE_TEMPORARILY_UNAVAILABLE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    # ---------------------------------------------------------------- 共用
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
              description: 穩定的錯誤代碼；使用者可見文案由前端依此在地化
            message:
              type: string
              description: 面向開發者的英文訊息
            correlation_id: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
                  params:
                    type: object
                    additionalProperties: { type: string }
                    description: 前端組文案用的少量資料（例如 `code_in_use` 的 `title`）；只含呼叫者本來就能檢視的內容

    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
        correlation_id: { type: string }

    # ---------------------------------------------------------------- Identity
    LicenseCapabilities:
      type: object
      required: [runtimeAllowed, configurationWriteAllowed, authoringAllowed,
                 upgradeAllowed, aiCoachAllowed, state]
      properties:
        runtimeAllowed:            { type: boolean }
        configurationWriteAllowed: { type: boolean }
        authoringAllowed:          { type: boolean }
        upgradeAllowed:            { type: boolean }
        aiCoachAllowed:            { type: boolean }
        state:
          type: string
          enum: [unlicensed, active, grace, frozen, blocked]
        maxOrganizations:  { type: integer }
        maxActiveLearners: { type: integer }
        expiresAt:         { type: string, format: date-time }
        maintenanceUntil:  { type: string, format: date-time }

    MeResponse:
      type: object
      required: [user, permissions, scopes, licenseCapabilities]
      properties:
        user:
          type: object
          required: [id, email, displayName, locale]
          properties:
            id:          { type: string, format: uuid }
            email:       { type: string, format: email }
            displayName: { type: string }
            locale:      { type: string }
        activeOrganization:
          type: [object, 'null']
          properties:
            id:       { type: string, format: uuid }
            name:     { type: string }
            branding: { type: object }
        organizations:
          type: array
          items:
            type: object
            properties:
              id:   { type: string, format: uuid }
              name: { type: string }
        permissions:
          type: array
          items: { type: string }
          description: 已解析的 permission code（SA §6.2）
        scopes:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [platform, organization, course, self] }
              id:   { type: [string, 'null'], format: uuid }
        licenseCapabilities: { $ref: '#/components/schemas/LicenseCapabilities' }

    # ---------------------------------------------------------------- Completion Rule
    RuleNode:
      oneOf:
        - $ref: '#/components/schemas/RuleGroup'
        - $ref: '#/components/schemas/RuleCondition'

    RuleGroup:
      type: object
      required: [operator, conditions]
      additionalProperties: false
      properties:
        operator: { type: string, enum: [AND, OR, NOT] }
        conditions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/RuleNode' }

    RuleCondition:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - required_activities_completed
            - specific_activities_completed
            - minimum_score
            - minimum_activity_score
            - video_watch_ratio
            - attempt_status
            - module_completed
            - lesson_completed
            - time_spent_minimum
            - attempt_count_maximum
            - manual_approval
        activity_id:   { type: string, format: uuid }
        activity_ids:  { type: array, items: { type: string, format: uuid } }
        module_id:     { type: string, format: uuid }
        lesson_id:     { type: string, format: uuid }
        approver_role: { type: string }
        scope:         { type: string, enum: [course, module] }
        scope_id:      { type: string, format: uuid }
        value:         {}
        negate:        { type: boolean }

    CompletionEvaluation:
      type: object
      description: SD §3.5。`trace` 同時供學員 UI 顯示「還差什麼」與教師除錯。
      required: [result, evaluated_at, trace]
      properties:
        enrollment_id:   { type: string, format: uuid }
        rule_set_id:     { type: string, format: uuid }
        grammar_version: { type: string }
        evaluated_at:    { type: string, format: date-time }
        result:          { type: boolean }
        trace:
          type: array
          items:
            type: object
            properties:
              path:   { type: string }
              type:   { type: string }
              result: { type: string, enum: [TRUE, FALSE, UNKNOWN] }
              detail: { type: object }
        blocking_reasons:
          type: array
          items:
            type: object
            properties:
              code:        { type: string }
              activity_id: { type: [string, 'null'], format: uuid }
              actual:      {}
              required:    {}

    # ---------------------------------------------------------------- Course
    ValidationReport:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }

    ValidationIssue:
      type: object
      required: [code, path, message]
      properties:
        code:     { type: string }
        path:     { type: string }
        message:  { type: string }
        targetId: { type: string, format: uuid }
        check:    { type: string, enum: [C1, C2, C3, C4, C5], description: 發布前檢查的項目（儲存完成條件時不帶） }

    VersionImpact:
      type: object
      properties:
        activeLearners:        { type: integer }
        completedLearners:     { type: integer }
        boundDocumentVersions: { type: integer }

    CourseVersionDetail:
      type: object
      required: [id, courseId, versionNo, status, title, editable]
      properties:
        id:              { type: string, format: uuid }
        courseId:        { type: string, format: uuid }
        versionNo:       { type: integer }
        status:
          type: string
          enum: [draft, review, published, superseded, archived]
        title:           { type: string }
        summary:         { type: string }
        navigationMode:  { type: string, enum: [strict, prerequisite, free, mixed] }
        modules:         { type: array, items: { type: object } }
        completionRuleSet:
          type: [object, 'null']
          properties:
            grammarVersion: { type: string }
            rule: { $ref: '#/components/schemas/RuleNode' }
        coachPolicy:       { $ref: '#/components/schemas/CoachPolicy' }
        knowledgeBindings: { type: array, items: { type: object } }
        publishedAt:       { type: string, format: date-time }
        contentSnapshotHash: { type: [string, 'null'], description: '發布時計算（`sha256:…`）；草稿為 null' }
        editable:
          type: boolean
          description: '等同 `status === "draft"`。false 時所有內容寫入回 409。'

    CoachPolicy:
      type: object
      additionalProperties: false
      required: [responseMode, maxDirectnessLevel, allowAnswerRevealAfterAttempts, preferredLanguage, citationRequired,
                 allowedKnowledgeScopes, toneProfile, followUpQuestions, prohibitedTopics, extraInstructions]
      properties:
        responseMode:
          type: string
          enum: [hint_first, coach_first, direct_allowed]
        maxDirectnessLevel:             { type: integer, minimum: 1, maximum: 5 }
        allowAnswerRevealAfterAttempts: { type: [integer, 'null'], minimum: 1, maximum: 20, description: null＝永不直接給答案 }
        preferredLanguage:              { type: string, enum: [zh-TW, en] }
        citationRequired:               { type: boolean }
        allowedKnowledgeScopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [course_source, verified_faq, common_error, platform] }
        toneProfile:                    { type: string, enum: [supportive, neutral, concise] }
        followUpQuestions:              { type: boolean }
        prohibitedTopics:               { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        extraInstructions:              { type: [string, 'null'], maxLength: 1000 }

    # ---------------------------------------------------------------- Runtime
    ActivityRuntime:
      type: object
      description: |
        `answer_key` 由序列化白名單剝除，永遠不會出現在此回應中
        （SD §7.3.4、SA THR-T-002）。
      required: [activityId, enrollmentId, title, activityType, componentType, schemaVersion, config, supported]
      properties:
        activityId:     { type: string, format: uuid }
        enrollmentId:   { type: string, format: uuid }
        supported:      { type: boolean, description: 伺服器有對應評分器；false 時前端顯示「尚未支援」 }
        inProgressAttemptId: { type: [string, 'null'], format: uuid }
        title:          { type: string }
        activityType:   { type: string, enum: [video, quiz, interactive, reading, assignment] }
        componentType:  { type: string }
        schemaVersion:  { type: string }
        config:         { type: object }
        attemptPolicy:
          type: object
          properties:
            maxAttempts:  { type: [integer, 'null'] }
            usedAttempts: { type: integer }
        previousResultSummary:
          type: object
          properties:
            status:    { type: string }
            score:     { type: [number, 'null'] }
            attemptNo: { type: integer }
        coachAvailable: { type: boolean }

    SubmitAttemptRequest:
      type: object
      description: |
        **刻意不接受 `score` / `status`**。成績一律由 server 端
        ActivityEvaluator 依 answer_key 產生（ADR-024、AC-LRN-003）。
        client 送來的任何評分欄位會被忽略（剝除，不報錯）。input 的形狀依元件而定（contracts/learning.ts）：
        閱讀 `{}`、影片 `{ watchedRatio }`、選擇題 `{ answers: { 題號: [選項] } }`、參數操作 `{ values }`、排序 `{ order }`。
      required: [input]
      properties:
        input:            {}
        clientDurationMs: { type: integer }

    ActivityResult:
      type: object
      required: [attemptId, attemptNo, status, maxScore, issues, evaluatedAt]
      properties:
        attemptId:  { type: string, format: uuid }
        attemptNo:  { type: integer }
        status:
          type: string
          enum: [passed, completed, needs_improvement, failed]
        score:      { type: [number, 'null'] }
        maxScore:   { type: number }
        issues:
          type: array
          items:
            type: object
            required: [code, category, severity]
            properties:
              code:     { type: string }
              category: { type: string }
              severity: { type: string, enum: [low, medium, high] }
              target:   { type: string, description: 問題所在的題目／參數／項目 id }
        feedbackData:      { type: object, description: 評分細節（例：各題對錯）；不含正解 }
        evaluatedAt:       { type: string, format: date-time }
        completionChanged: { type: boolean }

    LearningEventBatchRequest:
      type: object
      description: |
        `organizationId` / `learnerId` / `enrollmentId` **不接受** client 傳入；
        server 依 session 與 attempt 歸屬重新推導後覆寫（ADR-021、INV-1）。
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [eventId, eventType, eventVersion, occurredAt, payload]
            additionalProperties: false
            properties:
              eventId:
                type: string
                format: uuid
                description: client 產生的冪等鍵；重送會被去重
              eventType:    { type: string }
              eventVersion: { type: string, enum: ['1.0'] }
              occurredAt:   { type: string, format: date-time }
              activityId:   { type: string, format: uuid }
              payload:      { type: object }

    LearningEventBatchResponse:
      type: object
      properties:
        accepted:   { type: integer }
        duplicated: { type: integer }
        rejected:
          type: array
          items:
            type: object
            properties:
              eventId: { type: string }
              reason:  { type: string }

    # ---------------------------------------------------------------- Coach
    Citation:
      type: object
      required: [citationId, title, sourceUrl]
      properties:
        citationId:         { type: string, pattern: '^c[0-9]{1,2}$' }
        title:              { type: string }
        sourceUrl:
          type: string
          description: |
            指向 `/api/coach/citations/{id}/source`。URL 本身不是授權憑證——
            每次存取都會重新做 ACL 驗證（THR-I-004）。
        documentVersionId:  { type: string, format: uuid }
        derivedKnowledgeId: { type: string, format: uuid }
        chunkId:            { type: string }
        pageNo:             { type: integer }
        sectionPath:        { type: string }

    CoachAnswer:
      type: object
      required: [messageId, conversationId, answer, citations, status, disclaimer]
      properties:
        messageId:      { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        answer:         { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        status:
          type: string
          enum: [answered, insufficient_evidence, provider_unavailable, validation_failed]
        disclaimer:
          type: string
          description: '例如「此為 AI 教練建議，不影響成績」'
        followUpQuestions: { type: array, items: { type: string } }
        responseMode:
          type: string
          enum: [hint_first, coach_first, direct_allowed]

    CoachConversationSummary:
      type: object
      required: [id, triggerType, messageCount, startedAt, transcriptVisibility, readable]
      properties:
        id:                  { type: string, format: uuid }
        learnerId:           { type: string, format: uuid }
        learnerDisplayName:  { type: string }
        activityTitle:       { type: string }
        triggerType:         { type: string }
        messageCount:        { type: integer }
        startedAt:           { type: string, format: date-time }
        lastMessageAt:       { type: string, format: date-time }
        transcriptVisibility:
          type: string
          enum: [aggregate_only, course_staff]
          description: 對話建立時的戳印，不隨組織政策變更（ADR-028 條件 4）
        readable:
          type: boolean
          description: |
            組織政策 × 對話戳印的計算結果。false 時不提供逐字稿連結，
            且回應不含訊息內容。

    CoachTranscriptPolicy:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [aggregate_only, course_staff]
        decidedAt:
          type: string
          format: date-time
          description: 未決定時省略；resolver 對「未決定」回傳 aggregate_only
        decidedBy: { type: string, format: uuid }

    # ---------------------------------------------------------------- Knowledge
    DocumentVersion:
      type: object
      required: [id, documentId, versionNo, status, originalFilename, mimeType, sizeBytes, pageCount, chunkCount, failureReason, uploadedAt, processedAt]
      properties:
        id:               { type: string, format: uuid }
        documentId:       { type: string, format: uuid }
        versionNo:        { type: integer }
        status:
          type: string
          enum: [uploaded, scanning, rejected, parsing, chunking, indexing,
                 ready, failed, superseded, retired]
        originalFilename: { type: string }
        mimeType:         { type: string, description: 依檔頭判斷的格式，非上傳端宣稱 }
        sizeBytes:        { type: integer }
        pageCount:        { type: [integer, 'null'], description: PDF 頁數；其他格式為 null }
        chunkCount:       { type: [integer, 'null'] }
        failureReason:
          type: [string, 'null']
          description: unsupported_type、no_text（無文字層，例如掃描影像 PDF）、parse_failed:…、too_many_pages、too_much_text
        uploadedAt:       { type: string, format: date-time }
        processedAt:      { type: [string, 'null'], format: date-time }

    DerivedKnowledge:
      type: object
      required: [id, kind, status, evidenceStatus, clusterSize, question, answer]
      properties:
        id:   { type: string, format: uuid }
        kind: { type: string, enum: [faq, common_error, fix_path, trend] }
        status:
          type: string
          enum: [auto_generated, teacher_edited, verified, rejected, retired]
        evidenceStatus:
          type: string
          enum: [grounded, insufficient_evidence]
          description: |
            `insufficient_evidence` 者不得被 Coach 當作正式引用依據
            （ARCH §14.4-4）。
        clusterSize:
          type: integer
          description: 低於組織匿名門檻者不會產生（ARCH §14.5、NFR-PRIV-003）
        question:          { type: string }
        answer:            { type: string }
        citations:         { type: array, items: { $ref: '#/components/schemas/Citation' } }
        currentVersionNo:  { type: integer }
        firstSeenAt:       { type: string, format: date-time }
        lastSeenAt:        { type: string, format: date-time }

    # ---------------------------------------------------------------- Certificate
    PublicCertificate:
      type: object
      description: |
        公開端點的回應刻意精簡：不含分數、email、enrollmentId 或任何
        學習紀錄（ARCH §17.3、THR-I-005）。
      required: [status, publicId, organizationName, courseTitle, learnerDisplayName, issuedAt]
      properties:
        status:             { type: string, enum: [valid, revoked, expired] }
        publicId:           { type: string, description: 證書編號（ULID，印在證書上） }
        organizationName:   { type: string }
        courseTitle:        { type: string }
        learnerDisplayName: { type: string }
        issuedAt:           { type: string, format: date-time }
        validUntil:         { type: string, format: date-time }
        revokedAt:          { type: string, format: date-time }

# =============================================================================
# Paths
# =============================================================================
paths:

  # ------------------------------------------------------------------ Identity
  /auth/login:
    post:
      operationId: login
      tags: [Identity]
      security: []
      x-audit: auth.login.succeeded
      description: |
        帳號不存在與密碼錯誤回相同訊息與相近耗時（常數時間比對，THR-S-001）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: 成功，設定 session cookie }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      x-auth-only: true
      x-audit: auth.logout
      responses:
        '204': { description: 已登出 }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Identity]
      x-auth-only: true
      description: rotate session token
      responses:
        '200': { description: 已更新 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Identity]
      security: []
      x-audit: auth.password_reset.requested
      description: 常數時間回應，不透露帳號是否存在
      responses:
        '202': { description: 若帳號存在則已寄出 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Identity]
      security: []
      x-audit: auth.password_reset.completed
      description: |
        token 一次性；重設後撤銷該使用者所有 session、解除登入鎖定。
        token 無效、已使用或已過期回 422 `PASSWORD_RESET_TOKEN_INVALID`。
      responses:
        '204': { description: 已重設 }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me:
    get:
      operationId: getMe
      tags: [Identity]
      x-auth-only: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------ Organization
  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organization]
      x-required-permission: org.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: OK }
    post:
      operationId: createOrganization
      tags: [Organization]
      x-required-permission: platform.organization.create
      x-required-capability: configurationWriteAllowed
      x-required-limit: maxOrganizations
      x-audit: org.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
                name: { type: string, maxLength: 200 }
                initialAdmin:
                  type: object
                  additionalProperties: false
                  required: [email, displayName]
                  description: 新組織的首位管理員；寄出設定密碼邀請（ADR-030）
                  properties:
                    email: { type: string, format: email }
                    displayName: { type: string, maxLength: 200 }
      responses:
        '201': { description: '已建立；帶 initialAdmin 時回傳 `initialAdmin: { userId, invited, emailSent }`——`emailSent: false` 表示邀請信未能寄出，對方可改用「忘記密碼」設定密碼' }
        '400': { description: '`VALIDATION_FAILED`；代碼重複時 details 為 `code: already_exists`' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: getOrganization
      tags: [Organization]
      x-required-permission: org.read
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateOrganization
      tags: [Organization]
      x-required-permission: org.settings.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.updated
      description: 只改組織名稱；品牌改由 PATCH /organizations/{id}/branding（SD §6.16）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/{id}/branding:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: getOrganizationBranding
      tags: [Organization]
      x-required-permission: org.read
      description: 品牌設定值與實際套用結果（平台名稱、配色、Logo／小圖示網址；SD §6.16）
      responses:
        '200': { description: '`OrgBrandingDto`' }
    patch:
      operationId: updateOrganizationBranding
      tags: [Organization]
      x-required-permission: org.settings.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.branding.updated
      description: |
        平台名稱（null＝平台預設名稱）、八組預設配色之一，或自訂主色——自訂主色與白字的對比度須達 4.5
        （`color_contrast_too_low`，params.ratio）。選擇預設配色會清除自訂主色。平台管理員可設定任何組織。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                theme:        { type: string, enum: [academy_blue, ocean, teal, forest, wine, violet, orange, graphite] }
                customColor:  { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: null＝清除 }
                platformName: { type: string, maxLength: 60, description: 空字串或 null＝平台預設名稱 }
      responses:
        '200': { description: '`OrgBrandingDto`' }
        '400': { description: '`color_contrast_too_low`／`nothing_to_update`' }

  /organizations/{id}/branding/{kind}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, icon] } }
    put:
      operationId: putOrganizationBrandAsset
      tags: [Organization]
      x-required-permission: org.settings.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.branding.updated
      description: |
        Logo（橫式）或小圖示（方形）。以檔頭判斷格式，只收 PNG／JPEG／WebP（`unsupported_image_type`——不收 SVG）、
        512 KB 以內（`image_too_large`）。存於資料庫，取代舊的。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dataBase64]
              properties:
                dataBase64: { type: string, maxLength: 700000 }
      responses:
        '200': { description: '`OrgBrandingDto`' }
        '400': { description: '`unsupported_image_type`／`image_too_large`' }
    delete:
      operationId: deleteOrganizationBrandAsset
      tags: [Organization]
      x-required-permission: org.settings.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.branding.updated
      responses:
        '200': { description: '`OrgBrandingDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /branding/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPublicBranding
      tags: [Organization]
      security: []
      description: |
        組織登入畫面（前端 `/o/{code}`）用的品牌（不需登入；SD §6.16）：組織名稱、平台名稱、配色、Logo／小圖示網址。
        只限啟用中的組織，其他一律 404。每個 IP 每分鐘 300 次。放在 /api 之下而非 /public/：學校常共用對外 IP。
      responses:
        '200': { description: '`PublicBrandingDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /branding/{code}/{kind}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
      - { name: kind, in: path, required: true, schema: { type: string, enum: [logo, icon] } }
    get:
      operationId: getPublicBrandAsset
      tags: [Organization]
      security: []
      description: 圖檔（以儲存時判斷的型別回傳；nosniff、CSP default-src 'none'、快取一天、ETag＝sha256）。每個 IP 每分鐘 600 次
      responses:
        '200':
          description: 圖檔
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/disable:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      operationId: disableOrganization
      tags: [Organization]
      x-required-permission: platform.organization.disable
      x-required-capability: configurationWriteAllowed
      x-audit: org.disabled
      responses:
        '200': { description: 已停用 }

  /organizations/{id}/enable:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      operationId: enableOrganization
      tags: [Organization]
      x-required-permission: platform.organization.disable
      x-required-capability: configurationWriteAllowed
      x-audit: org.updated
      responses:
        '200': { description: 已啟用 }

  /organizations/{id}/users:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: listOrganizationUsers
      tags: [Organization]
      x-required-permission: org.user.read
      description: |
        依 email 排序、keyset 分頁，回 `{ data: OrgMemberDto[], meta: { next_cursor } }`。
        課程角色附 `course: { code, title }`，讓管理員看出是哪門課（SD §8.9）。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          description: 只列出持有此角色的成員（課程角色不分課程）；成員的其他角色仍完整回傳
          schema: { type: string, enum: [org_admin, course_admin, instructor, learner, auditor] }
        - name: q
          in: query
          description: 姓名或 email 的部分字串，不分大小寫；`%`、`_` 視為一般字元
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          description: 依在本組織的成員資格篩選（`membershipStatus`；帳號狀態見 `status` 欄位）
          schema: { type: string, enum: [active, disabled] }
      responses:
        '200': { description: OK }
        '400': { description: '`role` 不在列舉中' }
    post:
      operationId: createOrganizationUser
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-required-limit: maxActiveLearners
      x-audit: org.user.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, maxLength: 200 }
                role:
                  type: string
                  enum: [learner, instructor, course_admin, org_admin, auditor]
                  default: learner
                courseId:
                  type: string
                  format: uuid
                  description: course_admin／instructor 必填（課程須屬於本組織），其他角色不可指定。講師可直接加入，不必先掛成學員
      responses:
        '201': { description: '回傳 `{ userId, invited, emailSent }`。新帳號 `invited: true` 並寄出設定密碼邀請，`emailSent` 表示信件是否已交給郵件伺服器（失敗時對方可改用「忘記密碼」）；既有帳號 `invited: false`、`emailSent: false`（直接加入）' }
        '400': { description: '`email: already_member`；`courseId: course_id_mismatch`／`course_not_in_organization`' }

  /organizations/{id}/cohorts:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: listCohorts
      tags: [Organization]
      x-required-permission: org.user.read
      description: 班級／梯次（SD §6.15），含成員數。status：active（預設）／archived／all
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all] } }
      responses:
        '200': { description: '`CohortDto[]`' }
    post:
      operationId: createCohort
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.cohort.created
      description: 使用中的班級名稱在組織內不可重複（不分大小寫；`already_exists`）；封存的班級可以同名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                term: { type: string, maxLength: 50, description: 學年／期別（選填） }
      responses:
        '201': { description: '`CohortDto`' }
        '400': { description: '`already_exists`' }

  /organizations/{id}/cohorts/{cohortId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: cohortId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateCohort
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.cohort.updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                term: { type: string, maxLength: 50, description: 空字串或 null＝清除 }
      responses:
        '200': { description: '`CohortDto`' }
        '400': { description: '`already_exists`／`nothing_to_update`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/cohorts/{cohortId}/archive:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: cohortId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: archiveCohort
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.cohort.archived
      description: 封存後不再是成員的「目前班級」、不能整班加入；成員紀錄與選課上的班級名稱保留
      responses:
        '200': { description: '`CohortDto`' }
        '400': { description: '`cohort_already_archived`' }

  /organizations/{id}/cohorts/{cohortId}/restore:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: cohortId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreCohort
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.cohort.restored
      responses:
        '200': { description: '`CohortDto`' }
        '400': { description: '`cohort_not_archived`／`already_exists`（已有同名的使用中班級）' }

  /organizations/{id}/users/{userId}/profile:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateMemberProfile
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.member.updated
      description: |
        學號／員工編號與目前班級（SD §6.15）。cohortIds 整組取代「使用中」班級的成員資格，封存班級的紀錄保留。
        不改角色、不寄邀請。對象須為本組織成員（否則 404）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                memberNo:  { type: string, maxLength: 64, description: 空字串或 null＝清除；組織內不可重複（`member_no_taken`） }
                cohortIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        '200': { description: '`MemberProfileDto`' }
        '400': { description: '`member_no_taken`／`cohort_not_found`／`nothing_to_update`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/users/import:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    post:
      operationId: importOrganizationUsers
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      description: |
        批次匯入成員（SD §6.11）：每列 Email、姓名、角色（預設 learner）、課程代碼（選填：學員＝選課；講師／課程管理員＝指派該課）。
        `dryRun: true` 為預覽——完整執行後整批復原，回傳的逐列結果即實際匯入時會發生的事。錯誤的列不處理，其餘照常；
        已是成員者不經由匯入變更既有角色。新帳號不設密碼，實際匯入提交後寄出邀請。每列寫一筆稽核（`metadata.batch_id`）。
        學員人數超過授權上限時，預覽回報 `license.exceededBy`，實際匯入整批 403 `LICENSE_LIMIT_EXCEEDED`。
        課程相關的列另需 enrollment.assign／org.role.assign（否則該列 `permission_denied`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dryRun, rows]
              properties:
                dryRun: { type: boolean }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:       { type: string }
                      displayName: { type: string, maxLength: 200 }
                      role:        { type: string, description: 'learner／instructor／course_admin／org_admin／auditor；其他值該列回 invalid_role' }
                      courseCode:  { type: string }
                      memberNo:    { type: string, description: 學號／員工編號（設定或更新；與他人重複時該列 member_no_taken） }
                      cohort:      { type: string, description: 班級名稱（加入；不存在時 cohort_not_found，或依 createMissingCohorts 建立） }
                createMissingCohorts: { type: boolean, description: 班級名稱找不到時自動建立（SD §6.15） }
      responses:
        '200': { description: '`ImportReportDto`（逐列 outcome ok／skipped／error、actions、issue；summary；license）' }
        '400': { description: 格式錯誤或超過 500 列 }
        '403': { description: '`LICENSE_LIMIT_EXCEEDED`（實際匯入）或無權限' }

  /organizations/{id}/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: disableOrganizationUser
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.user.disabled
      description: |
        停用此使用者在**本組織**的成員資格（SD §8.9）：角色原樣保留、可恢復；本組織的權限從下一個請求起失效，
        課程列表的講師欄也不再列出。帳號本身與其他組織不受影響（停用整個帳號屬平台管理，另立端點）。
        已停用時再呼叫不變更（冪等）。不能停用自己；不能停用最後一位啟用中的 org_admin。
      responses:
        '200': { description: '`{ userId, membershipStatus: disabled }`' }
        '400': { description: '`cannot_disable_self`／`last_org_admin`' }
        '404': { description: 非本組織成員 }

  /organizations/{id}/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: enableOrganizationUser
      tags: [Organization]
      x-required-permission: org.user.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.user.enabled
      description: 恢復在本組織的成員資格，原有角色立即生效。未停用時再呼叫不變更（冪等）。
      responses:
        '200': { description: '`{ userId, membershipStatus: active }`' }
        '404': { description: 非本組織成員 }

  /organizations/{id}/admin-recovery:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: recoverOrganizationAdmin
      tags: [Organization]
      x-required-permission: platform.organization.create
      x-required-capability: configurationWriteAllowed
      x-audit: org.role.assigned
      description: |
        管理員復原（ADR-033）：組織已沒有任何啟用中的 org_admin 時，由平台管理員指定一位。
        仍有啟用中的管理員時回 400 `org_has_active_admin`。對象為新帳號時寄設定密碼邀請；
        既有帳號直接加上 org_admin。稽核記在該組織之下，metadata.reason = admin_recovery。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, maxLength: 200, description: 僅在建立新帳號時使用 }
      responses:
        '200': { description: '`{ userId, invited, emailSent }`' }
        '400': { description: '`org_has_active_admin` 或 `email: user_not_active`' }
        '404': { description: 組織不存在 }

  /organizations/{id}/users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: assignUserRoles
      tags: [Organization]
      x-required-permission: org.role.assign
      x-required-capability: configurationWriteAllowed
      x-audit: org.role.assigned
      description: |
        高風險操作，before/after 完整寫入 Audit。整組取代使用者在本組織的角色。
        course_admin／instructor 必須指定屬於本組織的課程；platform_admin 無法由此授予；
        非本組織成員回 404；不能移除自己的 org_admin（400 `cannot_remove_own_admin`）；
        會讓組織失去最後一位啟用中 org_admin 時回 400 `last_org_admin`。同一組織的角色變更
        鎖定組織列排隊進行，兩位管理員同時互相移除時只有一方成功（SD §8.9）。
        回應 `{ roles }`，課程角色附 `course: { code, title }`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [role]
                    properties:
                      role: { type: string, enum: [org_admin, course_admin, instructor, learner, auditor] }
                      courseId: { type: string, format: uuid, description: 課程角色必填，其他角色不可提供 }
      responses:
        '200': { description: OK }

  /organizations/{id}/ai-quota:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: getAiQuota
      tags: [Organization]
      x-required-permission: org.ai_quota.write
      responses:
        '200': { description: OK }
    put:
      operationId: updateAiQuota
      tags: [Organization]
      x-required-permission: org.ai_quota.write
      x-required-capability: configurationWriteAllowed
      x-audit: system.settings.updated
      responses:
        '200': { description: OK }

  /organizations/{id}/coach-transcript-policy:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: getCoachTranscriptPolicy
      tags: [Organization, Coach]
      x-required-permission: coach.transcript_policy.write
      responses:
        '200':
          description: |
            `decidedAt` 缺少代表尚未決定，UI 應強制管理者做一次明確選擇
            （SD §2.11.2）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachTranscriptPolicy' }
    put:
      operationId: updateCoachTranscriptPolicy
      tags: [Organization, Coach]
      x-required-permission: coach.transcript_policy.write
      x-required-capability: configurationWriteAllowed
      x-audit: coach.transcript_policy.updated
      description: |
        變更**不回溯**：既有對話維持其建立時的戳印（ADR-028 條件 4）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachTranscriptPolicy' }
      responses:
        '200': { description: OK }

  /organizations/{id}/reports:
    parameters: [{ $ref: '#/components/parameters/OrgId' }]
    get:
      operationId: getOrganizationReports
      tags: [Organization]
      x-required-permission: org.report.read
      description: 集體資訊須達匿名門檻後才呈現（ARCH §14.5）
      responses:
        '200': { description: OK }

  # -------------------------------------------------------------------- CMS
  /cms/pages/{pageKey}:
    parameters:
      - { name: pageKey, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCmsPage
      tags: [CMS]
      x-required-permission: cms.read
      responses:
        '200': { description: OK }

  /cms/pages/{pageKey}/draft:
    parameters:
      - { name: pageKey, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateCmsDraft
      tags: [CMS]
      x-required-permission: cms.write
      x-required-capability: configurationWriteAllowed
      x-audit: cms.updated
      description: block-based schema；禁止 raw HTML/script 注入（SD §7.5）
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /cms/pages/{pageKey}/publish:
    parameters:
      - { name: pageKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishCmsPage
      tags: [CMS]
      x-required-permission: cms.publish
      x-required-capability: configurationWriteAllowed
      x-audit: cms.published
      responses:
        '200': { description: OK }

  /cms/pages/{pageKey}/rollback:
    parameters:
      - { name: pageKey, in: path, required: true, schema: { type: string } }
    post:
      operationId: rollbackCmsPage
      tags: [CMS]
      x-required-permission: cms.rollback
      x-required-capability: configurationWriteAllowed
      x-audit: cms.rolled_back
      responses:
        '200': { description: OK }

  # ----------------------------------------------------------------- Course
  /courses:
    get:
      operationId: listCourses
      tags: [Course]
      x-required-permission: course.read
      description: |
        依 course.read 的授權範圍過濾：平台全部／組織內全部／被指派的課程（self 授權不擴大列表；
        學員的課程目錄另有端點）。依 code 排序、keyset 分頁，回 `{ data: CourseDto[], meta: { next_cursor } }`。
        每門課附 `staff`（啟用中的講師／課程管理員，講師在前），列表的「講師」欄不必逐一查詢。
        `sort` 參數目前不支援（SD §6.5）。
      parameters:
        - name: organizationId
          in: query
          description: 只列此組織的課程（仍受 course.read 範圍限制；供成員頁的課程選單使用）
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, archived] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: OK }
    post:
      operationId: createCourse
      tags: [Course]
      x-required-permission: course.create
      x-required-capability: authoringAllowed
      x-audit: course.created
      description: 建立於目前 session 的組織（organization scope 未指定參數時取 active organization）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                code:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                  description: 選填、組織內唯一。省略時依組織自動編號（`C-0001` 起，取現有 `C-####` 最大值 + 1）
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 5000 }
      responses:
        '201': { description: '`CourseDto`' }
        '400': { description: '`code: code_in_use`（`params.title` 為使用中的課程名稱）／`invalid_code`' }

  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: getCourse
      tags: [Course]
      x-required-permission: course.read
      responses:
        '200': { description: '`CourseDetailDto`（含版本清單）' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCourse
      tags: [Course]
      x-required-permission: course.archive
      x-required-capability: authoringAllowed
      x-audit: course.archived
      description: |
        **只做封存**（權限 course.archive、稽核 course.archived）：阻擋新選課，既有選課仍可完成，版本本身不變。
        課程名稱與說明的編輯需另立權限碼，屬後續項目（SD §6.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [archived] }
      responses:
        '200': { description: '封存後的 `CourseDetailDto`' }

  /courses/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: restoreCourse
      tags: [Course]
      x-required-permission: course.archive
      x-required-capability: authoringAllowed
      x-audit: course.restored
      description: |
        恢復封存（SD §6.5）：狀態依實際內容決定——有已發布版本為 `active`，否則為 `draft`。
        封存沒有改動版本、內容與人員，恢復只解除「新選課／新版本」的阻擋。權限與封存相同。
      responses:
        '200': { description: '恢復後的 `CourseDetailDto`' }
        '400': { description: '`not_archived`' }

  /courses/{id}/versions:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: createCourseVersion
      tags: [Course]
      x-required-permission: course.version.create
      x-required-capability: authoringAllowed
      x-audit: course.version.created
      description: 建立草稿（version_no = max+1），附預設 Coach Policy。同一課程同時至多一個 draft／review 版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                summary: { type: string, maxLength: 5000 }
                navigationMode: { type: string, enum: [strict, prerequisite, free, mixed], default: mixed }
      responses:
        '201': { description: '已建立 draft（`CourseVersionDetail`）' }
        '400': { description: '`draft_exists`（已有編輯中版本）／`course_archived`' }

  /courses/{id}/staff:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseStaff
      tags: [Course]
      x-required-permission: course.staff.assign
      description: 課程範圍的 instructor／course_admin（權限依據為 user_org_roles，course_staff 為同步名冊）
      responses:
        '200': { description: OK }
    post:
      operationId: assignCourseStaff
      tags: [Course]
      x-required-permission: course.staff.assign
      x-required-capability: configurationWriteAllowed
      x-audit: course.staff.assigned
      description: 以 email 指派，對象須為課程所屬組織的成員；回傳更新後的人員清單。移除請於組織成員角色編輯（會同步 course_staff）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [instructor, course_admin] }
      responses:
        '201': { description: '`CourseStaffDto[]`' }
        '400': { description: '`email: not_in_organization`' }

  /course-versions/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getCourseVersion
      tags: [Course]
      x-required-permission: course.version.read
      description: 課程人員用的完整內容（含 answerKey）；學員的活動 runtime 另有白名單端點，永不含 answerKey。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseVersionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCourseVersionDraft
      tags: [Course]
      x-required-permission: course.version.write
      x-required-capability: authoringAllowed
      x-audit: course.version.updated
      description: |
        **僅 Draft 可寫**。對 published/superseded/archived 版本寫入回
        409 `COURSE_VERSION_IMMUTABLE`——由應用層 Guard 與 DB 觸發器
        雙層阻擋（INV-2、AC-CRS-001）。`modules` 提供時整組取代課程結構（SD §6.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                title: { type: string, maxLength: 200 }
                summary: { type: [string, 'null'], maxLength: 5000 }
                navigationMode: { type: string, enum: [strict, prerequisite, free, mixed] }
                modules:
                  type: array
                  maxItems: 50
                  description: |
                    ModuleDto 形狀。既有項目以 id 保留（完成條件以 id 引用活動），新項目由前端產生 UUID。
                    lesson 內容區塊限 richtext／image／video／callout／activity。
                    上限：50 單元、每單元 100 課節、每課節 50 活動、總計 2000 活動。
                  items: { type: object }
      responses:
        '200': { description: 更新後的 `CourseVersionDetail` }
        '400':
          description: |
            `VALIDATION_FAILED`：`duplicate_id`、`id_conflict`（沿用其他版本的 id）、`activity_not_in_lesson`、
            `interactive_requires_definition`、`unknown_interactive_definition`、`too_many_activities`、`json_too_large`
        '409': { $ref: '#/components/responses/Conflict' }

  /course-versions/{id}/validate:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: validateCourseVersion
      tags: [Course]
      x-required-permission: course.version.validate
      description: |
        ARCH §6.3 的五項檢查（SD §6.7）：C1 無法到達的必修活動（先修條件＋導覽模式的依賴圖）、
        C2 完成條件必須存在且引用有效（含各活動先修條件）、C3 綁定教材是否處理完成、
        C4 Coach Policy 存在且值域合法、C5 互動活動的 config／answerKey 符合元件 schema。
        問題以 `check` 分組；有錯誤時 `valid: false`，仍回 200，讓 UI 先預覽。
      responses:
        '200':
          description: 驗證報告（`valid` 可能為 false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationReport' }

  /course-versions/{id}/publish:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: publishCourseVersion
      tags: [Course]
      x-required-permission: course.version.publish
      x-required-capability: authoringAllowed
      x-audit: course.version.published
      description: |
        原子操作（SD §6.7）：鎖定課程列 → 本版須為 draft／review → 同一交易內重跑 validate，有錯誤即 422
        → 舊的 published 轉 superseded → 本版轉 published 並寫入 `content_snapshot_hash`（內容的穩定序列化 sha256）
        → 課程由 draft 轉 active。knowledge_bindings 已指向特定 document_version_id，隨版本凍結。
      responses:
        '200': { description: '發布後的 `CourseVersionDetail`（含 `contentSnapshotHash`）' }
        '400': { description: '`course_archived`' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`COURSE_VALIDATION_FAILED`：`details[]` 為 validate 的錯誤（`field`＝path、`issue`＝code、`params.check`／`params.message`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /course-versions/{id}/clone:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: cloneCourseVersion
      tags: [Course]
      x-required-permission: course.version.create
      x-required-capability: authoringAllowed
      x-audit: course.version.cloned
      description: |
        來源須為 published／superseded。深拷貝結構並換成新 id，JSON 內（完成條件、先修條件、內容區塊、
        config／answerKey）等於舊 id 的值一併改寫；複製完成條件、Coach Policy 與知識綁定。
        既有 enrollment 仍指向原版本（AC-CRS-002）。
      responses:
        '201': { description: 已建立新 draft（`CourseVersionDetail`） }
        '400': { description: '`source_not_published`／`draft_exists`／`course_archived`' }

  /course-versions/{id}/hotfix:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: hotfixCourseVersionMetadata
      tags: [Course]
      x-required-permission: course.version.hotfix
      x-required-capability: authoringAllowed
      x-audit: course.version.updated
      description: |
        僅限純 typo／無語意影響的文案（ARCH §6.2-7）。仍保留 revision history。
        任何影響學習結果、順序、題目、Rubric 或 Coach Policy 的變更一律走新版本。
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /course-versions/{id}/impact:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getCourseVersionImpact
      tags: [Course]
      x-required-permission: course.version.read
      description: 供 UI 顯示「目前有 N 名學員綁定此版本」（ARCH §6.3）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionImpact' }

  /interactive-definitions:
    get:
      operationId: listInteractiveDefinitions
      tags: [Course]
      x-required-permission: course.version.read
      description: 啟用中的互動元件（id、componentType、schemaVersion、displayName、configSchema），供課程編輯器選擇（SD §6.5）
      responses:
        '200': { description: '`InteractiveDefinitionDto[]`' }

  /course-versions/{id}/completion-rules:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    put:
      operationId: updateCompletionRules
      tags: [Course]
      x-required-permission: course.completion_rule.write
      x-required-capability: authoringAllowed
      x-audit: course.completion_rule.updated
      description: |
        儲存前以 SD §3.6 驗證器檢查（SD §6.6）：錯誤回 422，警告（恆不成立等）照存並隨回應回傳。
        之後編輯結構可能讓引用失效，發布前 validator（C2）會再檢查。`rule: null` 清除完成條件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rule]
              properties:
                grammarVersion: { type: string, enum: ['1.0'], default: '1.0' }
                rule:
                  oneOf:
                    - $ref: '#/components/schemas/RuleNode'
                    - { type: 'null' }
      responses:
        '200':
          description: '`{ completionRuleSet: { grammarVersion, rule } | null, warnings: ValidationIssue[] }`'
        '400': { description: '欄位格式（未知欄位、grammarVersion 不支援、JSON 超過 64 KB）' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `COURSE_VALIDATION_FAILED`：`details[].field` 為 JSON 路徑（如 `$.conditions[1].activity_id`）、
            `issue` 為 `RULE_SCHEMA_INVALID`／`RULE_DEPTH_EXCEEDED`／`RULE_TOO_COMPLEX`／`RULE_REFERENCE_NOT_FOUND`／
            `RULE_TYPE_MISMATCH`／`RULE_VALUE_OUT_OF_RANGE`，`params.message` 為說明
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /course-versions/{id}/coach-policy:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    put:
      operationId: updateCoachPolicy
      tags: [Course, Coach]
      x-required-permission: course.coach_policy.write
      x-required-capability: authoringAllowed
      x-audit: course.coach_policy.updated
      description: 整組取代（所有欄位必填）；值域白名單，會組進 AI 提示詞（SD §6.6、§10.1.2）。稽核只記變更的欄位。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoachPolicy' }
      responses:
        '200': { description: '儲存後的 `CoachPolicy`' }
        '400': { description: 欄位缺漏或超出值域 }
        '409': { $ref: '#/components/responses/Conflict' }

  /course-versions/{id}/migrate-learners:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: preview, in: query, schema: { type: boolean, default: false } }
    post:
      operationId: migrateLearnersToVersion
      tags: [Course, Enrollment]
      x-required-permission: course.learner_migration.execute
      x-required-capability: configurationWriteAllowed
      x-audit: course.learner_migration.executed
      description: 須先以 `?preview=true` 取得影響範圍（ARCH §6.2-5）
      responses:
        '200': { description: OK }

  # ------------------------------------------------------------- Enrollment
  /courses/{id}/enrollments:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: createEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.assign
      x-required-limit: maxActiveLearners
      x-audit: enrollment.assigned
      description: |
        管理者指派學員（SD §6.8）；自行加入（`enrollment.self_enroll`）、選課碼、審核於後續批次另立端點。
        綁定當下的 active published version（AC-CRS-003）；課程列鎖定，與發布排隊。對象須為課程所屬組織的
        啟用成員；尚無學員角色者自動補上（稽核 `metadata.learner_role_granted`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:   { type: string, format: email }
                dueDate: { type: string, format: date-time }
      responses:
        '201': { description: '`EnrollmentDto`' }
        '400': { description: '`course_not_published`／`course_archived`；`email: not_in_organization`／`member_disabled`／`already_enrolled`' }
        '403': { description: '`LICENSE_LIMIT_EXCEEDED`（進行中的學員數達授權上限）或無權限' }

  /courses/{id}/cohorts:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseCohorts
      tags: [Enrollment]
      x-required-permission: enrollment.assign
      description: 課程所屬組織的使用中班級（供整班加入；SD §6.15）。課程人員不需組織的成員讀取權限
      responses:
        '200': { description: '`CohortDto[]`' }

  /courses/{id}/enrollments/cohort:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: enrollCohort
      tags: [Enrollment]
      x-required-permission: enrollment.assign
      x-required-capability: configurationWriteAllowed
      description: |
        整班加入（SD §6.15）：班級目前的成員全部選這門課，與課程學員匯入同一段程式——dryRun 預覽、逐列結果、
        授權上限、稽核；不建立帳號。選課記下當時的班級（cohort_label 快照）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dryRun, cohortId]
              properties:
                dryRun:   { type: boolean }
                cohortId: { type: string, format: uuid }
      responses:
        '200': { description: '`ImportReportDto`' }
        '400': { description: '`cohort_not_found`（不存在、不屬於此組織或已封存）／`cohort_empty`／`cohort_too_large`' }
        '403': { description: '`LICENSE_LIMIT_EXCEEDED`（實際加入）或無權限' }

  /courses/{id}/enrollments/import:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      operationId: importCourseEnrollments
      tags: [Enrollment]
      x-required-permission: enrollment.assign
      x-required-capability: configurationWriteAllowed
      description: |
        批次加入學員（SD §6.11）：每列 Email、姓名（選填）。尚非本組織成員者需填姓名，且匯入者須在該組織有
        org.user.write 才能建立帳號（否則該列 `not_in_organization`）。預覽、逐列結果、授權上限、稽核同成員匯入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dryRun, rows]
              properties:
                dryRun: { type: boolean }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [email]
                    properties:
                      email:       { type: string }
                      displayName: { type: string, maxLength: 200 }
      responses:
        '200': { description: '`ImportReportDto`' }
        '400': { description: 格式錯誤或超過 500 列 }
        '403': { description: '`LICENSE_LIMIT_EXCEEDED`（實際匯入）或無權限' }

  /courses/{id}/learners:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseLearners
      tags: [Enrollment]
      x-required-permission: learning.result.read_all
      description: 課程的選課名單（含已退課），依 email keyset 分頁；`memberDisabled` 表示成員資格已停用
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, suspended, completed, reopened, withdrawn, rejected] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: '`{ data: CourseLearnerDto[], meta: { next_cursor } }`' }

  /me/active-organization:
    put:
      operationId: setActiveOrganization
      tags: [Identity]
      x-auth-only: true
      description: 切換目前 session 的 active organization（SD §8.12）。只能切到本人有角色且為啟用狀態的組織，其他一律 404（ADR-019）；不影響其他 session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId: { type: string, format: uuid }
      responses:
        '200':
          description: 切換後的 MeResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '404': { description: 非本人所屬、已停用或不存在的組織 }

  /me/profile:
    patch:
      operationId: updateMyProfile
      tags: [Identity]
      x-auth-only: true
      x-audit: user.profile.updated
      description: 編輯本人的顯示名稱與語系（SA UC-ORG-005）。email 不可自行變更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                displayName: { type: string, minLength: 1, maxLength: 200 }
                locale: { type: string, enum: [zh-TW, en] }
      responses:
        '200': { description: '`{ displayName, locale }`' }
        '400': { description: '`VALIDATION_FAILED`（含 `nothing_to_update`、`unrecognized_key`）' }

  /me/password:
    post:
      operationId: changeMyPassword
      tags: [Identity]
      x-auth-only: true
      x-audit: auth.password.changed
      description: |
        變更本人密碼：需目前密碼；帳號每 15 分鐘 5 次。成功後撤銷本人其他所有 session（目前的保留），
        並作廢尚未使用的重設／邀請連結。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: 已變更 }
        '400': { description: '`currentPassword: incorrect`、`newPassword: same_as_current` 或長度不符' }
        '429': { description: '`RATE_LIMITED`' }

  /me/enrollments:
    get:
      operationId: listMyEnrollments
      tags: [Enrollment]
      x-required-permission: learning.result.read_self
      description: 本人的選課（self 範圍）；只含啟用中組織、且本人成員資格未停用者；`canLearn` 為 active／reopened
      responses:
        '200': { description: '`MyEnrollmentDto[]`' }

  /enrollments/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: approveEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.approve
      x-audit: enrollment.approved
      responses:
        '200': { description: OK }

  /enrollments/{id}/withdraw:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: withdrawEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.withdraw
      x-audit: enrollment.withdrawn
      description: pending／active／suspended／reopened → withdrawn；學習紀錄保留，之後可重新指派（新的一筆選課）
      responses:
        '200': { description: '`EnrollmentDto`' }
        '400': { description: '`invalid_transition`（`params.from` 為目前狀態）' }

  /enrollments/{id}/suspend:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: suspendEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.suspend
      x-audit: enrollment.suspended
      description: active／reopened → suspended（暫停期間不能學習，但仍計入授權的學員數）
      responses:
        '200': { description: '`EnrollmentDto`' }
        '400': { description: '`invalid_transition`' }

  /enrollments/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: resumeEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.suspend
      x-audit: enrollment.resumed
      description: suspended → active
      responses:
        '200': { description: '`EnrollmentDto`' }
        '400': { description: '`invalid_transition`' }

  /enrollments/{id}/relearning:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: assignRelearning
      tags: [Enrollment]
      x-required-permission: enrollment.relearning.assign
      x-audit: enrollment.relearning.assigned
      description: |
        歷史 attempt/result 完整保留，以新 attempt 疊加（INV-6、AC-LRN-004）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopeType, reason]
              properties:
                scopeType: { type: string, enum: [course, module, lesson, activity] }
                scopeId:   { type: string, format: uuid }
                reason:    { type: string }
                dueDate:   { type: string, format: date-time }
                newAttemptPolicy: { type: string, enum: [append, reset_counter] }
      responses:
        '201': { description: 已指派 }

  /enrollments/{id}/reopen:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: reopenEnrollment
      tags: [Enrollment]
      x-required-permission: enrollment.reopen
      x-audit: enrollment.reopened
      responses:
        '200': { description: OK }

  /enrollments/{id}/timeline:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getEnrollmentTimeline
      tags: [Enrollment]
      x-required-permission: learning.timeline.read_all
      description: |
        課程人員檢視學員的學習歷程（SD §6.12）：新到舊、keyset 分頁；高頻事件（video.progressed、activity.input_changed、
        activity.heartbeat）不列出，改以學習時間呈現；payload 只挑白名單欄位。學員讀自己的走 `/me/enrollments/{id}/timeline`
        （self 授權不被上層範圍涵蓋，ADR-016）。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: '`EnrollmentTimelineDto`（data、meta.next_cursor、time）' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/enrollments/{id}/timeline:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getMyEnrollmentTimeline
      tags: [Enrollment]
      x-required-permission: learning.timeline.read_self
      description: 學員自己的學習歷程（內容同 getEnrollmentTimeline）。self 範圍：不是本人的選課一律 404
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: '`EnrollmentTimelineDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enrollments/{id}/progress:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getEnrollmentProgress
      tags: [Enrollment]
      x-required-permission: learning.result.read_all
      description: |
        課程人員檢視單一學員（SD §6.12）：與學員看到的大綱相同——各活動狀態、最佳成績、次數、影片觀看比例、
        進度與未完成原因、學習時間——另附學員資料。
      responses:
        '200': { description: '`LearnerProgressDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /enrollments/{id}/completion:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getCompletionEvaluation
      tags: [Enrollment]
      x-required-permission: learning.result.read_all
      description: 課程人員檢視單一學員的完成判定（即時重算、不寫入；SD §6.9）。含 trace 與 blocking_reasons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionEvaluation' }

  /enrollments/{id}/completion-approvals:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: approveCompletion
      tags: [Enrollment]
      x-required-permission: learning.result.read_all
      x-audit: completion.approved
      description: |
        人工核可（SD §6.14）：完成條件含 `manual_approval` 時使用。路由的權限只確認是課程人員；
        核可人須在此課程（或其組織）實際擔任條件指定的角色，否則 403 `approver_role_required`。
        一次核可涵蓋其擔任且尚未核可的所有角色；同一交易重算完成判定——因此完成時寫入 course.completed 並排入發證。
        選課須為 active／reopened（否則 409 `ENROLLMENT_NOT_ACTIVE`）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, maxLength: 500, description: 記錄於稽核 }
      responses:
        '200': { description: '`CompletionApprovalDto`（approvedRoles、completionChanged）' }
        '400': { description: '`approval_not_required`／`already_approved`' }
        '403': { description: '`approver_role_required` 或無權限' }
        '409': { $ref: '#/components/responses/Conflict' }

  /enrollments/{id}/outline:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getLearnerOutline
      tags: [Runtime]
      x-required-permission: learning.result.read_self
      description: |
        學員的課程大綱（SD §6.9）：單元／課節／內容區塊、各活動狀態（locked／available／in_progress／attempted／completed）
        與鎖定原因（sequence＝學習順序、prerequisite＝先修條件）、最佳成績、進度與未完成原因。
        **不含活動設定與答案**。self 範圍：不是本人的選課一律 404。
      responses:
        '200': { description: '`LearnerOutlineDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Runtime
  /activities/{id}/runtime:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getActivityRuntime
      tags: [Runtime]
      x-required-permission: learning.attempt.write_self
      x-required-capability: runtimeAllowed
      description: |
        學員在此活動所屬版本的選課須為 active／reopened（否則 409 `ENROLLMENT_NOT_ACTIVE`；沒有選課 404），
        活動須已解鎖（否則 403 `ACTIVITY_PREREQUISITE_NOT_MET`，`details[0].issue` 為 sequence／prerequisite）。
        config 以白名單回傳，answer_key 不在查詢欄位中。沒有互動元件的活動 componentType 為
        `builtin.reading`／`builtin.video`／`builtin.quiz`；伺服器沒有評分器的類型 `supported: false`（SD §6.9）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityRuntime' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /activities/{id}/attempts:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: createAttempt
      tags: [Runtime]
      x-required-permission: learning.attempt.write_self
      x-required-capability: runtimeAllowed
      description: |
        同一活動只能有一個進行中的作答：新建時舊的轉 abandoned（SA §7.3）。次數上限以已送出的作答計。
        檢查同 runtime（選課可學習、活動已解鎖）。
      responses:
        '201': { description: '`{ attemptId, attemptNo }`' }
        '400': { description: '`max_attempts_reached`／`activity_not_supported`' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attempts/{id}/events:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: ingestLearningEvents
      tags: [Runtime]
      x-required-permission: learning.event.write_self
      x-required-capability: runtimeAllowed
      description: |
        學員端事件（SD §6.12）：只收進行中作答的 video.started、video.progressed、activity.input_changed、activity.heartbeat；
        其餘事件只由伺服器產生。身分欄位由作答與選課推導；occurredAt 限未來 1 分鐘～過去 24 小時。
        逐筆回報 rejected（unknown_event_type、invalid_payload、payload_too_large、activity_mismatch、
        occurred_at_out_of_range、attempt_closed）；event_id 重送算 duplicated。
        每 enrollment 每分鐘上限 120 筆（以事件數計）；超額回 429 並丟棄，**不阻斷學習**（THR-D-002）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LearningEventBatchRequest' }
      responses:
        '202':
          description: 已接收
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningEventBatchResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /attempts/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: submitAttempt
      tags: [Runtime]
      x-required-permission: learning.attempt.write_self
      x-required-capability: runtimeAllowed
      description: |
        伺服器評分 → 寫入 append-only 結果 → 作答轉 scored → 同一交易重算完成判定並寫入進度快照（ADR-020）。
        評估路徑上零 LLM 呼叫，因此 Coach 中斷不影響完成與發證（INV-4、AC-LRN-002）。
        輸入格式錯誤 422 `ACTIVITY_INPUT_INVALID`（`details[].issue` 為評分器的代碼、`params.message` 為說明），作答維持進行中可重送。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAttemptRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResult' }
        '400': { description: '`attempt_not_in_progress`／`activity_not_supported`' }
        '404': { description: 不是本人的作答 }
        '409': { description: '`ENROLLMENT_NOT_ACTIVE`' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /attempts/{id}/result:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getAttemptResult
      tags: [Runtime]
      x-required-permission: learning.result.read_self
      description: 只有作答者本人看得到，其他人一律 404（AC-LRN-007）；尚未評分 409 `RESULT_NOT_READY`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Coach
  /enrollments/{id}/coach:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getEnrollmentCoach
      tags: [Coach]
      x-required-permission: coach.conversation.read_self
      description: |
        AI 教練能不能用（`available`、`reason`：disabled_by_organization、provider_unavailable、search_unavailable、
        enrollment_inactive）與這位學員在此選課的對話（最多 20）。不要求 aiCoachAllowed——未授權時前端依
        `licenseCapabilities` 顯示原因。不是本人的選課 → 404（SD §6.19）。
      responses:
        '200': { description: CoachAvailabilityDto }
        '404': { $ref: '#/components/responses/NotFound' }

  /course-versions/{id}/coach/test:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: testCoach
      tags: [Coach]
      x-required-permission: coach.interact_test
      x-required-capability: aiCoachAllowed
      description: |
        教師測試模式（SD §6.19）：以自己的身分在課程版本（含草稿）試問，檢索、提示詞與驗證都與學員相同。
        對話標為 `is_test`、不綁選課、不列入統計；帶 `conversationId` 可延續同一段測試對話。回傳 JSON（不串流）。
        每人每分鐘 20 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:        { type: string, minLength: 1, maxLength: 2000 }
                conversationId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachAnswer' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /organizations/{id}/ai-credential:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getOrgAiCredential
      tags: [Coach, Organization]
      x-required-permission: org.read
      description: |
        組織 AI gateway 虛擬金鑰的狀態（SD §6.22、ADR-034）：`mode`（organization＝AI_PROVIDER=litellm，每個組織自己的金鑰；
        platform＝平台共用設定）、`configured`、`alias`（金鑰代號）、`updatedAt`、`updatedBy`、`encryptionReady`。
        **金鑰本身永遠不回傳。**
      responses:
        '200': { description: OrgAiCredentialDto }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: setOrgAiCredential
      tags: [Coach, Organization]
      x-required-permission: platform.ai_provider.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.ai_credential.updated
      description: |
        平台管理員設定（或更換）組織的虛擬金鑰。以 AES-256-GCM 加密後存放（主金鑰為環境變數 AI_KEY_ENCRYPTION_KEY，
        AAD＝組織 id）；未設定主金鑰 → 422 `encryption_key_missing`。稽核只記代號與是否設定，不記金鑰。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [alias, key]
              properties:
                alias: { type: string, minLength: 1, maxLength: 100, description: 金鑰代號（例如 LiteLLM 的 key alias） }
                key:   { type: string, minLength: 8, maxLength: 2048, writeOnly: true, description: 虛擬金鑰（不含空白） }
      responses:
        '200': { description: OrgAiCredentialDto（不含金鑰） }
    delete:
      operationId: removeOrgAiCredential
      tags: [Coach, Organization]
      x-required-permission: platform.ai_provider.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.ai_credential.removed
      description: 移除組織的金鑰；之後該組織的 AI 教練不可用（學員畫面隱藏），其他功能不受影響。沒有金鑰 → 404。
      responses:
        '204': { description: 已移除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/ai-credential/test:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: testOrgAiCredential
      tags: [Coach, Organization]
      x-required-permission: platform.ai_provider.write
      description: |
        以該組織的設定測試連線：OpenAI 相容／LiteLLM 呼叫 `GET /models`，Claude 呼叫 Models API——驗證金鑰與模型權限，
        不產生回答、不耗用 token。reason：ok、unauthorized、model_not_available、unreachable、quota、error、
        provider_unavailable（平台未設定 gateway 或主金鑰）、organization_key_missing。每人每分鐘 10 次。
      responses:
        '200': { description: AiConnectionTestDto }

  /organizations/{id}/coach-settings:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getCoachSettings
      tags: [Coach, Organization]
      x-required-permission: org.read
      description: 組織的 AI 教練設定、平台是否已設定 AI 服務、今日已用 token 與每日上限（SD §6.19）。
      responses:
        '200': { description: CoachSettingsDto }
    put:
      operationId: updateCoachSettings
      tags: [Coach, Organization]
      x-required-permission: coach.transcript_policy.write
      x-required-capability: configurationWriteAllowed
      x-audit: org.coach_settings.updated
      description: |
        `enabled`：組織可停用 AI 教練（學員看到「暫時無法使用」，其他功能不受影響）。
        `transcriptVisibility`：只影響之後建立的對話——既有對話的戳印不可變（ADR-028 條件 4）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:              { type: boolean }
                transcriptVisibility: { type: string, enum: [aggregate_only, course_staff] }
      responses:
        '200': { description: CoachSettingsDto }

  /coach/conversations:
    post:
      operationId: createCoachConversation
      tags: [Coach]
      x-required-permission: coach.interact_self
      x-required-capability: aiCoachAllowed
      description: |
        建立時依組織當下政策戳印 `transcript_visibility`，之後不可變
        （ADR-028 條件 4、SD §2.11.3）。只能建立在自己的選課上（否則 404）；
        `activityId` 須屬於該選課的課程版本。組織停用教練或選課已結束 → 503 `COACH_PROVIDER_UNAVAILABLE`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrollmentId]
              properties:
                enrollmentId: { type: string, format: uuid }
                activityId:   { type: string, format: uuid }
      responses:
        '201': { description: CoachConversationDto（含 messages） }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /coach/conversations/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getCoachConversation
      tags: [Coach]
      x-required-permission: coach.conversation.read_self
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /coach/conversations/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: sendCoachMessage
      tags: [Coach]
      x-required-permission: coach.interact_self
      x-required-capability: aiCoachAllowed
      description: |
        SSE 分階段回應（ADR-025）：

        ```
        event: stage    {"stage":"retrieving"}              < 1 s
        event: sources  {"citations":[...]}                 < 3 s  已 ACL 驗證，安全早送
        event: stage    {"stage":"composing"}
        event: stage    {"stage":"validating"}
        event: token    {"delta":"..."}                     驗證通過後才開始
        event: done     {"messageId":"...","status":"answered"}
        ```

        `token` **只在** ResponseValidator 通過後才送出——未驗證的 LLM
        文字永遠不會到達瀏覽器（INV-5）。檢索結果先於生成完成且已通過
        ACL 過濾，因此可提前送出讓學員先閱讀教材。

        實作（SD §6.19）：組織停用、供應商未設定、檢索服務未設定、選課已結束 → 開始串流前回 503
        `COACH_PROVIDER_UNAVAILABLE`（details.issue 說明原因）；組織當日 token 用完 → 429 `AI_QUOTA_EXCEEDED`。
        開始串流後的錯誤以 `event: error` 回報；模型失敗、拒答或驗證兩次未過 → `done` 的 status 為 `fallback`
        （固定的安全替代文字）。每 15 秒送一行註解（`: ping`）避免代理斷線。每人每分鐘 10 次、每日 200 次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: SSE 串流
          content:
            text/event-stream:
              schema: { type: string }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /coach/from-result:
    post:
      operationId: startCoachFromResult
      tags: [Coach]
      x-required-permission: coach.interact_self
      x-required-capability: aiCoachAllowed
      description: |
        AI 不重新評分、不改變 pass/fail（INV-3）。ResponseValidator 的 V7
        會攔截任何宣稱改分的回答，且 `app_coach` 資料庫角色對
        `learning_results` 只有 SELECT（ADR-026）。

        實作（SD §6.21）：只能用自己的作答（否則 404）；尚無結果 → 409 `RESULT_NOT_READY`。
        建立 `trigger_type = result_trigger` 的對話，系統依結果產生問題（活動、結果、分數、問題代碼）存為學員訊息，
        檢索以活動名稱與問題代碼查詢，提示詞 CONTEXT 帶 `current_result`（不含作答內容）。
        驗證與替代規則同一般問答；回 JSON，之後可在對話中延續。每人每分鐘 10 次、每日 200 次（與問答共用）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId]
              properties:
                attemptId: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoachAnswer' }
        '409': { description: '`RESULT_NOT_READY`' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /coach/citations/{id}/source:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: openCitationSource
      tags: [Coach, Knowledge]
      x-required-permission: coach.citation.open
      description: |
        URL 本身不是授權憑證：每次存取都重新做 ACL 驗證（THR-I-004）。
      responses:
        '200': { description: Viewer payload + highlight range }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /courses/{id}/coach/usage:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: getCourseCoachUsage
      tags: [Coach]
      x-required-permission: coach.usage_stats.read
      description: |
        僅匿名彙整，須達匿名門檻（ARCH §14.5）。最近 30 天、不含教師測試：使用學員數、對話數、提問數、
        結果觸發數、回答狀態分布、最常引用的教材（前 5）、各活動的提問量。使用學員數未達平台設定
        `derived.min_threshold`（預設 5）時 `belowThreshold = true`，其餘欄位為 null／空；各活動也只列出達門檻者（SD §6.21）。
      responses:
        '200': { description: CoachUsageDto }

  /courses/{id}/coach/conversations:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseCoachConversations
      tags: [Coach]
      x-required-permission: coach.conversation.read_course
      x-audit: coach.transcript.read
      description: |
        實作（SD §6.21）：只列出**可讀**的對話（組織目前政策與對話戳印都是 `course_staff`），最近 100 則；
        不可讀的對話不列出學員身分，只回 `hiddenCount`。組織政策為 `aggregate_only` 時 `data` 為空。
        不含教師測試與沒有訊息的對話。每次讀取都寫 `coach.transcript.read`（寫不進去則請求失敗）。
      responses:
        '200': { description: 'CoachTranscriptListDto：policy、data（id、learnerId、learnerDisplayName、activityTitle、triggerType、messageCount、startedAt、lastMessageAt）、hiddenCount' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courses/{id}/coach/conversations/{convId}:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - { name: convId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readCourseCoachTranscript
      tags: [Coach]
      x-required-permission: coach.conversation.read_course
      x-audit: coach.transcript.read
      description: |
        **權限通過不等於可讀**。`TranscriptVisibilityGuard` 另檢查兩個
        彼此獨立的條件（SD §8.7）：

        | 組織政策 | 對話戳印 | 結果 |
        |---|---|---|
        | `course_staff` | `course_staff` | 可讀 |
        | `course_staff` | `aggregate_only` | 403 — 對話建立於承諾不可見的期間 |
        | `aggregate_only` | `course_staff` | 403 — 組織已收回政策 |
        | `aggregate_only` | `aggregate_only` | 403 |

        本端點與其列表版本是**唯二寫 Audit 的讀取型 API**。留痕是這項
        權限得以開放的前提（ADR-028 條件 3），因此 audit 寫入失敗時
        本請求必須失敗——與一般 audit 的「不回滾業務交易」原則相反，
        屬刻意例外。該筆紀錄同時出現在學員自己的 `audit.read_self` 摘要中（稽核 metadata 帶 `learner_id`）。
        不可讀 → 403 `COACH_TRANSCRIPT_NOT_VISIBLE`（details.issue：organization_policy／conversation_stamp）；
        對話不屬於此課程或為教師測試 → 404。
      responses:
        '200': { description: CoachTranscriptDto（摘要＋messages） }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Content
  /courses/{id}/assets:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseAssets
      tags: [Content]
      x-required-permission: course.version.read
      description: 課程素材（圖片、影片），新到舊；`usedBy` 列出引用它的課程版本（SD §6.23）。
      responses:
        '200': { description: 'MediaAssetDto[]' }
    post:
      operationId: uploadCourseAsset
      tags: [Content]
      x-required-permission: course.version.write
      x-required-capability: authoringAllowed
      x-audit: course.asset.uploaded
      description: |
        本體為檔案原始內容（`application/octet-stream`，串流寫入）。格式以檔頭判斷：圖片 PNG／JPEG／WebP（≤ 20 MB，不收 SVG）、
        影片 MP4（ISO BMFF，不收 QuickTime）／WebM（≤ 平台設定 `upload.max_size`）；其他 415。
        物件 key：`{prefix}/media/{org}/{course}/{asset}/original.bin`（不含檔名）。封存的課程不能上傳（422 `course_archived`）。
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, maxLength: 255 } }
        - { name: title, in: query, schema: { type: string, maxLength: 200 }, description: 顯示名稱，預設取檔名 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: MediaAssetDto }
        '413': { description: '`UPLOAD_TOO_LARGE`' }
        '415': { description: '`UNSUPPORTED_MEDIA_TYPE`' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /assets/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: renameAsset
      tags: [Content]
      x-required-permission: course.version.write
      x-required-capability: authoringAllowed
      x-audit: course.asset.updated
      description: 只能改顯示名稱；素材內容不可變（更換＝上傳新素材再改引用）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200': { description: MediaAssetDto }
    delete:
      operationId: deleteAsset
      tags: [Content]
      x-required-permission: course.version.write
      x-required-capability: authoringAllowed
      x-audit: course.asset.deleted
      description: 被任何課程版本（含草稿）引用時不可刪 → 422 `asset_in_use`（params.versions 列出版本）。刪除時一併移除物件。
      responses:
        '204': { description: 已刪除 }
        '404': { $ref: '#/components/responses/NotFound' }

  /assets/{id}/content:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getAssetContent
      tags: [Content]
      x-required-permission: [course.read, learning.result.read_self]
      description: |
        素材內容（圖片 `<img>`、影片 `<video>` 直接使用此網址）。每次存取都檢查：同組織，且持有此課程的 course.read
        （課程人員、組織管理員）或本人在這門課有未退選的選課；否則 404。支援單一 Range（影片拖曳，206／416），
        型別取自上傳時的檔頭判斷，`nosniff`、`CSP: default-src 'none'; sandbox`，ETag＝SHA-256（304）。
        nginx 對此路徑關閉緩衝、串流直送。
      responses:
        '200': { description: 內容 }
        '206': { description: 部分內容（Range） }
        '304': { description: 未變更 }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: Range 無法滿足 }

  # -------------------------------------------------------------- Knowledge
  /course-versions/{id}/knowledge:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listCourseKnowledge
      tags: [Knowledge]
      x-required-permission: knowledge.document.read
      description: |
        此版本綁定的教材（各附綁定的版本與最新上傳的版本、處理狀態）與本課程其他版本用過、
        尚未綁在此版本的教材（`available`）。`editable` = 版本為草稿（SD §6.17）。
      responses:
        '200': { description: OK }

  /course-versions/{id}/knowledge/search:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: searchCourseKnowledge
      tags: [Knowledge]
      x-required-permission: knowledge.document.read
      description: |
        課程人員測試檢索（SD §6.18）：與 AI 教練同一個檢索器（lexical_only：BM25 + cjk_bigram）與範圍——
        這個課程版本綁定的教材、`verification_status` ∈ {source, verified}、`acl_scope` ∈ {course, organization}，
        組織由伺服器決定。最多 10 筆，依知識類型加權排序。以 POST 傳送問題（不放網址，避免進入存取紀錄）。
        每位使用者每分鐘 60 次。此版本沒有可檢索的教材時直接回空結果；有教材但搜尋服務未設定或無法連線 → 503。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: 'KnowledgeSearchResultDto：hits（chunkId、documentId、documentVersionId、title、pageNo、sectionPath、content、score）、searchableDocuments、pendingDocuments' }
        '429': { description: 超過每分鐘次數上限 }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /course-versions/{id}/knowledge/documents:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: filename, in: query, required: true, schema: { type: string, maxLength: 255 }, description: 原始檔名（只作顯示；副檔名用來區分 .docx／.md／.txt） }
      - { name: title, in: query, schema: { type: string, maxLength: 200 }, description: 顯示名稱，預設取檔名 }
    post:
      operationId: uploadKnowledgeDocument
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.uploaded
      description: |
        只限草稿版本（否則 409 `COURSE_VERSION_IMMUTABLE`）。本體為檔案原始內容（`application/octet-stream`，
        不經 multipart），以串流寫入、邊計算大小與 SHA-256；上限為平台設定 `upload.max_size`（預設 512 MB）。
        格式以檔頭判斷：PDF、Word（.docx）、Markdown、UTF-8 純文字，其他 415。
        檔案先放入物件儲存的 quarantine（key 不含檔名，SD §5.1），建立 source_document／document_version（uploaded）、
        綁定此版本並排入 `document.parse`（同一交易）。worker 移出 quarantine、擷取文字、切段後轉為 `indexing`；
        以 `GET .../knowledge` 輪詢進度。惡意程式掃描 hook 尚未接上（SA SEQ-06 可插拔）。
        未設定物件儲存時 503 `SOURCE_TEMPORARILY_UNAVAILABLE`。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: 已接收，處理中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '409': { description: '`COURSE_VERSION_IMMUTABLE`' }
        '413': { description: '`UPLOAD_TOO_LARGE`' }
        '415': { description: '`UNSUPPORTED_MEDIA_TYPE`' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /course-versions/{id}/knowledge/bindings:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: bindKnowledgeDocument
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      x-audit: course.version.updated
      description: |
        把本課程的教材（指定版本）加入這個草稿版本。其他課程或其他組織的教材 → 422 `document_not_in_course`；
        同一份教材已在此版本 → 422 `document_already_bound`；格式不符或已下架 → 422 `document_not_usable`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documentVersionId]
              properties:
                documentVersionId: { type: string, format: uuid }
      responses:
        '200': { description: 更新後的教材清單（同 listCourseKnowledge） }
        '409': { description: '`COURSE_VERSION_IMMUTABLE`' }

  /course-versions/{id}/knowledge/bindings/{documentVersionId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: documentVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: unbindKnowledgeDocument
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      x-audit: course.version.updated
      description: 從草稿版本移出（教材本身保留，之後可再加入）。
      responses:
        '200': { description: 更新後的教材清單 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`COURSE_VERSION_IMMUTABLE`' }

  /course-versions/{id}/knowledge/faqs:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listCourseFaqs
      tags: [Knowledge]
      x-required-permission: knowledge.document.read
      responses:
        '200': { description: OK }
    post:
      operationId: createCourseFaq
      tags: [Knowledge]
      x-required-permission: knowledge.faq.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.uploaded
      description: 教師建立的正式 FAQ 屬 Source Knowledge，檢索優先權高於衍生知識
      responses:
        '201': { description: 已建立 }

  /knowledge/faqs/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateCourseFaq
      tags: [Knowledge]
      x-required-permission: knowledge.faq.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.version_added
      responses:
        '200': { description: OK }
    delete:
      operationId: deleteCourseFaq
      tags: [Knowledge]
      x-required-permission: knowledge.faq.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.deleted
      responses:
        '204': { description: 已刪除 }

  /knowledge/documents/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: filename, in: query, required: true, schema: { type: string, maxLength: 255 } }
    post:
      operationId: addDocumentVersion
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.version_added
      description: |
        上傳方式與 uploadKnowledgeDocument 相同（`application/octet-stream`）。草稿課程版本中引用這份教材的綁定
        改指向新版；已發布的 course_version 其 knowledge_bindings 仍指向舊 document_version，因此舊學員的
        citation 不會失效（ARCH §13.5）。舊版於新版索引完成後轉 superseded（Phase 3-2）。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: 已接收，處理中
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '413': { description: '`UPLOAD_TOO_LARGE`' }
        '415': { description: '`UNSUPPORTED_MEDIA_TYPE`' }

  /knowledge/documents/{id}/versions/{versionId}/retry:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: retryDocumentVersion
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      description: 處理失敗（failed）後重新排入解析（SA §7.4 Failed → Parsing）；其他狀態 → 422 `not_failed`。
      responses:
        '202':
          description: 已重新排入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }

  /knowledge/documents/{id}/versions/{versionId}/view:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: page, in: query, schema: { type: integer, minimum: 1 }, description: PDF 的頁碼；其他格式忽略（顯示全文） }
    get:
      operationId: viewDocumentSource
      tags: [Knowledge]
      x-required-permission: knowledge.document.read
      description: |
        課程人員預覽系統擷取出的文字（依頁；上限 20 萬字元，超過時 `truncated`）。尚未擷取完成 → 422 `not_processed`。
        學員不經此端點，而是經 AI 教練的引用開啟原文（`/coach/citations/{id}/source`，Phase 3-4）。
      responses:
        '200': { description: 'DocumentViewDto：title、versionNo、status、pageCount、page、text、truncated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /knowledge/documents/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    delete:
      operationId: deleteKnowledgeDocument
      tags: [Knowledge]
      x-required-permission: knowledge.document.write
      x-required-capability: authoringAllowed
      x-audit: knowledge.document.deleted
      description: |
        刪除整份教材（所有版本、草稿版本中的綁定、物件儲存中的檔案）。已發布或已被取代的課程版本仍引用時
        不可刪 → 422 `document_in_use`（已發布的內容不可變，舊學員的引用不能失效）。
      responses:
        '204': { description: 已刪除 }

  /knowledge/reindex:
    post:
      operationId: triggerReindex
      tags: [Knowledge, System]
      x-required-permission: knowledge.reindex.execute
      x-required-capability: configurationWriteAllowed
      x-audit: knowledge.reindex.triggered
      responses:
        '202': { description: 已排入佇列 }

  /course-versions/{id}/derived-knowledge:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: listDerivedKnowledge
      tags: [Knowledge]
      x-required-permission: derived.read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DerivedKnowledge' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /derived-knowledge/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    patch:
      operationId: updateDerivedKnowledge
      tags: [Knowledge]
      x-required-permission: derived.write
      x-required-capability: authoringAllowed
      x-audit: derived.edited
      description: 建立新版本，保留 auto-generated 原文（ARCH §14.4-5）
      responses:
        '200': { description: OK }

  /derived-knowledge/{id}/verify:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: verifyDerivedKnowledge
      tags: [Knowledge]
      x-required-permission: derived.verify
      x-required-capability: authoringAllowed
      x-audit: derived.verified
      description: verified 版本的檢索權重高於 auto_generated（SA §15.3）
      responses:
        '200': { description: OK }

  /derived-knowledge/{id}/reject:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: rejectDerivedKnowledge
      tags: [Knowledge]
      x-required-permission: derived.verify
      x-required-capability: authoringAllowed
      x-audit: derived.rejected
      responses:
        '200': { description: OK }

  /derived-knowledge/{id}/retire:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: retireDerivedKnowledge
      tags: [Knowledge]
      x-required-permission: derived.verify
      x-required-capability: authoringAllowed
      x-audit: derived.retired
      responses:
        '200': { description: OK }

  # ------------------------------------------------------------ Certificate
  /me/certificates:
    get:
      operationId: listMyCertificates
      tags: [Certificate]
      x-required-permission: certificate.read_self
      description: 自己的證書（有效、已撤銷、已過期），含驗證碼（SD §6.14）
      responses:
        '200': { description: '`MyCertificateDto[]`' }

  /me/certificates/{id}:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: getMyCertificate
      tags: [Certificate]
      x-required-permission: certificate.read_self
      description: 網頁版證書（瀏覽器列印／另存 PDF）。self 範圍：不是本人的一律 404
      responses:
        '200': { description: '`MyCertificateDto`' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{id}/certificates:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      operationId: listCourseCertificates
      tags: [Certificate]
      x-required-permission: certificate.read_all
      description: 課程已發出的證書（含學員 email、撤銷原因；不含驗證碼）
      responses:
        '200': { description: '`CourseCertificateDto[]`' }

  /certificates/{id}/download:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    get:
      operationId: downloadCertificate
      tags: [Certificate]
      x-required-permission: certificate.read_self
      description: |
        proxy streaming；每次存取重新驗證 self/course scope。
        **尚未實作**：目前證書為網頁版（GET /me/certificates/{id}，瀏覽器列印／另存 PDF），伺服器端 PDF 於後續批次（SD §6.14）。
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /certificates/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
    post:
      operationId: revokeCertificate
      tags: [Certificate]
      x-required-permission: certificate.revoke
      x-audit: certificate.revoked
      description: |
        撤銷**不刪除** PDF object，只改狀態並留 Audit（ARCH §17.4、AC-CRT-004）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { description: '已撤銷；回傳 `CourseCertificateDto`。同交易寫入 certificate.revoked 學習事件' }
        '400': { description: '`not_revocable`（只有有效的證書可以撤銷）或缺少原因' }

  # ---------------------------------------------------------------- License
  /platform/license:
    get:
      operationId: getLicense
      tags: [License]
      x-required-permission: platform.license.read
      responses:
        '200': { description: OK }

  /platform/license/capabilities:
    get:
      operationId: getLicenseCapabilities
      tags: [License]
      x-required-permission: platform.license.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseCapabilities' }

  /platform/license/activate:
    post:
      operationId: activateLicense
      tags: [License]
      x-required-permission: platform.license.activate
      x-audit: license.activated
      description: |
        以內建 public key 驗簽（僅接受 EdDSA，拒絕 `alg: none`），比對
        hardware fingerprint；offline 模式另檢查 nonce 未過期未使用。
        同一 license_id 不接受比已安裝版本更早簽發者。
        **刻意不要求 license capability**——未授權狀態下必須仍能啟用授權。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [licenseFile]
                  properties:
                    licenseFile: { type: string, description: 供應方簽發的授權檔內容（JWS） }
                - type: object
                  additionalProperties: false
                  required: [activationCode]
                  properties:
                    activationCode: { type: string, description: 線上啟用碼（需設定 LICENSE_ACTIVATION_URL） }
      responses:
        '200':
          description: 已啟用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseCapabilities' }
        '503': { description: '`LICENSE_ACTIVATION_UNAVAILABLE`：線上啟用服務未設定或無法連線' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform/license/challenge:
    post:
      operationId: createLicenseChallenge
      tags: [License]
      x-required-permission: platform.license.activate
      x-audit: license.challenge_issued
      description: |
        產生離線啟用用的一次性 challenge（SEQ-09）。

        **技術限制的誠實聲明**：純 VM、離線、無 TPM 的情境下，使用者可透過
        snapshot/clone 繞過「同硬體只能 Trial 一次」。系統會記錄 last_seen
        並偵測 clock rollback，但這是 tamper detection，不是絕對防護
        （ARCH §18.5、ADR-014）。
      responses:
        '200':
          description: challenge blob——交給供應方，換取綁定本機的授權檔
          content:
            application/json:
              schema:
                type: object
                required: [challenge, fingerprint, weakFingerprint, expiresAt]
                properties:
                  challenge: { type: string }
                  fingerprint: { type: string }
                  weakFingerprint: { type: boolean, description: 可用硬體識別不足 2 項（ADR-014） }
                  expiresAt: { type: string, format: date-time }

  # ----------------------------------------------------------------- System
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [System]
      x-required-permission: [audit.read_platform, audit.read_org, audit.read_course, audit.read_self]
      description: |
        持有任一 audit.read_* 即可進入（SA UC-AUD-001），結果依授權過濾為四種可見範圍：
        platform（全部）／organization／course／self（僅與本人相關，`visibility: self`，
        移除 IP、User-Agent、變更前後、metadata 與執行者 email）。依 occurred_at 由新到舊，keyset 分頁。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: action, in: query, description: '精確比對；以 `.*` 結尾為前綴（例：`org.*`）', schema: { type: string, pattern: '^[a-z][a-z_.]*(\.\*)?$' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 不含（exclusive）, schema: { type: string, format: date-time } }
      responses:
        '200': { description: '`{ data: AuditLogDto[], meta: { next_cursor } }`（packages/contracts/src/audit.ts）' }
        '400': { description: '`VALIDATION_FAILED`（limit、cursor、action 或時間區間不合法）' }

  /audit-logs/export:
    post:
      operationId: exportAuditLogs
      tags: [System]
      x-required-permission: audit.export
      x-audit: audit.exported
      description: |
        同步 CSV 匯出（ADR-032；物件儲存上線後改為非同步 job）。區間最多 366 天、最多 50,000 列，
        超過回 400 不做部分匯出。CSV 以 UTF-8 BOM 開頭；以 = + - @ 開頭的儲存格加上單引號（防公式注入）。
        查詢條件與筆數寫入 audit.exported 的 metadata。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time, description: 不含（exclusive） }
                action: { type: string }
                organizationId: { type: string, format: uuid, description: 限定單一組織；須在呼叫者的匯出範圍內，否則 404 }
      responses:
        '200':
          description: CSV 檔（Content-Disposition attachment）
          content:
            text/csv:
              schema: { type: string }
        '400': { description: '`VALIDATION_FAILED`：`to: range_too_large`（超過 366 天）或 `to: too_many_rows`（超過 50,000 列）' }
        '404': { description: organizationId 不在匯出範圍內 }

  /notifications:
    get:
      operationId: listNotifications
      tags: [System]
      x-required-permission: notification.read_self
      responses:
        '200': { description: OK }

  /platform/settings:
    get:
      operationId: getPlatformSettings
      tags: [System]
      x-required-permission: platform.settings.read
      description: 設定目錄（packages/contracts/src/settings.ts）內每個鍵的生效值、預設值、是否為預設與最後修改者
      responses:
        '200': { description: '`PlatformSettingDto[]`' }
    put:
      operationId: updatePlatformSettings
      tags: [System]
      x-required-permission: platform.settings.write
      x-required-capability: configurationWriteAllowed
      x-audit: system.settings.updated
      description: |
        部分更新。只接受設定目錄內的鍵（不接受任意鍵）；值為目錄範圍內的整數，`null` 表示恢復預設（刪除該列）。
        稽核只記錄實際有變更之鍵的 before／after。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                upload.max_size: { type: [integer, 'null'], minimum: 1048576, maximum: 10737418240 }
                derived.min_threshold: { type: [integer, 'null'], minimum: 2, maximum: 100 }
      responses:
        '200': { description: '更新後的 `PlatformSettingDto[]`' }
        '400': { description: '`VALIDATION_FAILED`：未知的鍵、超出範圍、非整數，或 `nothing_to_update`' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /platform/ai-provider:
    get:
      operationId: getAiProvider
      tags: [System]
      x-required-permission: platform.ai_provider.write
      responses:
        '200': { description: 'API key 於回應中遮罩' }
    put:
      operationId: updateAiProvider
      tags: [System]
      x-required-permission: platform.ai_provider.write
      x-required-capability: configurationWriteAllowed
      x-audit: ai.provider.updated
      description: |
        預設為 `none`——資料離開客戶邊界必須是刻意行為（SA §22.1）。
        首次設定精靈強制三選一：外部 Provider／內部 endpoint／暫不啟用。
      responses:
        '200': { description: OK }

  /platform/backups:
    get:
      operationId: listBackups
      tags: [System]
      x-required-permission: platform.backup.execute
      responses:
        '200': { description: OK }
    post:
      operationId: executeBackup
      tags: [System]
      x-required-permission: platform.backup.execute
      x-audit: backup.executed
      responses:
        '202': { description: 已排入佇列 }

  /system/jobs:
    get:
      operationId: getJobQueueStatus
      tags: [System]
      x-required-permission: platform.health.read
      description: 依佇列與工作類型統計 pending／running／24 小時內 succeeded、最舊待處理等待秒數、過期鎖數量與 DLQ（最近 20 筆，錯誤截斷 500 字元）
      responses:
        '200': { description: '`JobQueueStatus`（packages/contracts/src/settings.ts）' }

  /system/health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      description: liveness probe——僅檢查進程存活
      responses:
        '200': { description: OK }

  /system/ready:
    get:
      operationId: getReadiness
      tags: [System]
      security: []
      description: |
        readiness probe。**刻意不包含 Elasticsearch 與 LLM**（ADR-023）：
        若列入，其故障會導致整個 API 被判定不可用，違反
        NFR-AVAIL-002/003。兩者狀態以 `degraded[]` 呈現。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:    { type: boolean }
                  degraded: { type: array, items: { type: string } }

  /system/metrics:
    get:
      operationId: getMetrics
      tags: [System]
      x-required-permission: platform.health.read
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema: { type: string }

  # ------------------------------------------------------- Public（免認證）
  /public/certificates/{verificationCode}:
    parameters:
      - name: verificationCode
        in: path
        required: true
        schema: { type: string, minLength: 20 }
    get:
      operationId: verifyCertificatePublic
      tags: [Certificate]
      security: []
      servers:
        - url: https://{host}
          variables: { host: { default: localhost } }
      description: |
        QR 驗證端點。per-IP rate limit + 常數時間比對；查無資料回 404 且
        回應時間不因存在與否而顯著差異（THR-D-005、AC-CRT-005）。
        實作（SD §6.14）：每個 IP 每分鐘 30 次（API）＋ nginx /public/ 限流；驗證碼格式不符直接 404；
        以唯一索引查詢。前端查驗頁為 `/verify/{verificationCode}`（不需登入）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCertificate' }
        '404': { description: 查無此驗證碼 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/cms/home:
    get:
      operationId: getPublicHome
      tags: [CMS]
      security: []
      servers:
        - url: https://{host}
          variables: { host: { default: localhost } }
      responses:
        '200': { description: OK }
